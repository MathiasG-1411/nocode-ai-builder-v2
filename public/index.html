<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoCode AI Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col">

<!-- Header -->
<header class="gradient-bg px-6 py-4 flex items-center justify-between shadow-xl">
  <div class="flex items-center gap-3">
    <div class="w-9 h-9 bg-white/20 rounded-xl flex items-center justify-center text-xl">🚀</div>
    <div>
      <span class="font-bold text-lg">NoCode AI Builder</span>
      <span id="modelBadge" class="ml-2 text-xs bg-white/20 px-2 py-0.5 rounded-full">Gemini 2.5</span>
    </div>
  </div>
  <div class="flex gap-2">
    <button id="newProjectBtn" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm font-medium transition-all">+ Nouveau</button>
    <button id="openTabBtn" class="hidden bg-white text-indigo-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-gray-100 transition-all">↗ Ouvrir</button>
  </div>
</header>

<!-- Main -->
<div class="flex flex-1 overflow-hidden" style="height:calc(100vh - 65px)">

  <!-- Left Panel -->
  <div class="w-96 bg-gray-900 flex flex-col border-r border-gray-800 overflow-y-auto">

    <!-- Templates -->
    <div class="p-4 border-b border-gray-800">
      <p class="text-xs text-indigo-400 font-semibold mb-3">① TYPE D'APP</p>
      <div class="grid grid-cols-2 gap-2" id="templateGrid"></div>
    </div>

    <!-- Description -->
    <div class="p-4 border-b border-gray-800">
      <p class="text-xs text-indigo-400 font-semibold mb-2">② DÉCRIS TON APP</p>
      <textarea id="mainPrompt" rows="5"
        placeholder="Ex: Une app de gestion de tâches pour une équipe marketing, avec des catégories par projet, des priorités et des dates limite..."
        class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-3 text-sm text-white placeholder-gray-500 resize-none focus:border-indigo-500 focus:outline-none"></textarea>
      <p class="text-xs text-gray-600 mt-1">Ctrl+Entrée pour générer</p>
    </div>

    <!-- Generate -->
    <div class="p-4 border-b border-gray-800">
      <button id="generateBtn" class="w-full gradient-bg hover:opacity-90 py-3.5 rounded-xl font-bold text-white transition-all flex items-center justify-center gap-2 shadow-lg text-base">
        <span id="generateBtnText">✨ Générer l'app</span>
      </button>
      <div id="statusMsg" class="hidden mt-2 text-xs text-center py-1.5 px-3 rounded-lg"></div>
    </div>

    <!-- Modify -->
    <div id="modifySection" class="hidden p-4 border-b border-gray-800">
      <p class="text-xs text-indigo-400 font-semibold mb-2">③ MODIFIER</p>
      <textarea id="modifyPrompt" rows="3"
        placeholder="Ex: Ajoute une barre de recherche, change les couleurs en bleu..."
        class="w-full bg-gray-800 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white placeholder-gray-500 resize-none focus:border-indigo-500 focus:outline-none"></textarea>
      <button id="modifyBtn" class="mt-2 w-full bg-indigo-600 hover:bg-indigo-700 py-2.5 rounded-xl text-sm font-semibold transition-all">
        Appliquer la modification
      </button>
    </div>

    <!-- Download -->
    <div id="downloadSection" class="hidden p-4">
      <button id="downloadBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 py-2.5 rounded-xl text-sm font-bold transition-all">
        ⬇️ Télécharger le HTML
      </button>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- Tabs + device -->
    <div class="bg-gray-900 border-b border-gray-800 flex items-center px-4 py-2 gap-1">
      <button id="tab-preview" class="tab-active px-4 py-1.5 rounded-lg text-sm transition-all">👁️ Aperçu</button>
      <button id="tab-code" class="px-4 py-1.5 rounded-lg text-sm transition-all bg-gray-800 text-gray-400">💻 Code</button>
      <div class="ml-auto flex gap-1">
        <button id="dev-full"   class="text-xs px-3 py-1 rounded-lg bg-gray-700 text-white">🖥️</button>
        <button id="dev-tablet" class="text-xs px-3 py-1 rounded-lg bg-gray-800 text-gray-500">📱 768</button>
        <button id="dev-mobile" class="text-xs px-3 py-1 rounded-lg bg-gray-800 text-gray-500">📲 375</button>
      </div>
    </div>

    <!-- Preview -->
    <div id="panel-preview" class="flex-1 flex items-center justify-center bg-gray-800 overflow-hidden">
      <div id="emptyState" class="text-center p-10 max-w-md">
        <div class="text-7xl mb-5">🎨</div>
        <h2 class="text-2xl font-bold mb-3">Génère ton app</h2>
        <p class="text-gray-400 text-sm">Choisis un type, décris ce que tu veux, et Gemini génère une app <strong>100% fonctionnelle</strong> en quelques secondes.</p>
      </div>
      <div id="loadingState" class="hidden text-center p-10">
        <div class="loader mx-auto mb-6"></div>
        <h2 class="text-xl font-bold mb-2">Gemini génère ton app...</h2>
        <p class="text-gray-400 text-sm mt-1">15 à 30 secondes pour une app complète</p>
      </div>
      <div id="previewWrapper" class="hidden w-full h-full flex items-center justify-center p-4">
        <div id="deviceBox" class="bg-white rounded-2xl overflow-hidden shadow-2xl w-full h-full transition-all duration-300">
          <iframe id="previewFrame" style="width:100%;height:100%;border:none;"></iframe>
        </div>
      </div>
    </div>

    <!-- Code -->
    <div id="panel-code" class="hidden flex-1 overflow-auto bg-gray-950 p-5">
      <pre id="codeDisplay" class="text-emerald-400 whitespace-pre-wrap break-all text-xs"></pre>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
